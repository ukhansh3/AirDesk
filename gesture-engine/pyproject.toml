[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airdesk-gesture"
version = "0.1.0"
description = "AirDesk gesture recognition and local PLEOS diagnostic PoC"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]
camera = ["opencv-contrib-python>=4.9,<5", "mediapipe>=0.10,<0.11"]
ws = ["websockets>=14,<17", "jsonschema>=4.23,<5"]
all = ["opencv-contrib-python>=4.9,<5", "mediapipe>=0.10,<0.11", "websockets>=14,<17", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

