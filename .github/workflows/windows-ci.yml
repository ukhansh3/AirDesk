name: Windows WPF build (manual)
on:
  workflow_dispatch:
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compile WPF shell
        run: dotnet build windows-host/AirDesk.Host/AirDesk.Host.csproj --configuration Release
