name: Windows security harness and WPF build (manual)
on:
  workflow_dispatch:
jobs:
  windows-build:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run mock and security harness (no native input)
        run: dotnet run --project windows-host/AirDesk.Host.Tests/AirDesk.Host.Tests.csproj --configuration Release
      - name: Compile WPF host
        run: dotnet build windows-host/AirDesk.Host/AirDesk.Host.csproj --configuration Release
