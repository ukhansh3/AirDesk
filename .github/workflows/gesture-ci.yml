name: Gesture + Protocol CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        working-directory: gesture-engine
        run: python -m pip install -e ".[dev,ws]"
      - name: Gesture and JSON Schema tests
        working-directory: gesture-engine
        run: python -m unittest discover -s tests -v
